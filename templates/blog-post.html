{% extends "base.html" %}

{% block content %}
<h1 class="title">
  {{ page.title }}
</h1>
<p class="subtitle">
  {% if page.date %}Published <strong>{{ page.date }}</strong>.{% endif %}
  {% if page.updated %}Last updated <strong>{{ page.updated }}</strong>.{% endif %}
</p>
{{ page.content | safe }}
{% endblock content %}
