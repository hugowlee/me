<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Hugo Lee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ get_url(path="style.css") }}">
</head>

<body>
  <header>
    <h1><a href="{{ config.base_url }}">Home</a></h1>
    <nav>
      <a href="https://github.com/hugowlee">GH</a>
      <a href="{{ get_url(path="/blog/") }}">Archives</a>
    </nav>
  </header>

  <main>
    {% block content %} {% endblock content %}
  </main>

  <footer>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('sidenotes');
      const markers = document.querySelectorAll('.sn-marker');
      console.log(markers);

      markers.forEach(marker => {
        const id = marker.dataset.snId;
        const text = marker.dataset.snText;
        console.log(marker.dataset);

        const sidenote = document.createElement('div');
        sidenote.className = 'sn-content';
        // sidenote.id = `sn-${id}`;
        sidenote.innerHTML = `<sup style="margin-right: 6px;">${id}.</sup>${text}`;

        marker.insertAdjacentElement('afterend', sidenote);
      });
    });
  </script>

  {% if page.footnotes %}
  <div class="footnotes-section">
    <h3>Footnotes</h3>
    <div class="footnotes-list">
      {% for fn in page.footnotes %}
      <div class="footnote" id="footnote-{{ fn.id }}">
        <a href="#fn-marker-{{ fn.id }}" class="footnote-backlink"><sup>{{ fn.id }}</sup></a>
        {{ fn.text | safe }}
      </div>
      {% endfor %}
    </div>
  </div>
  {% endif %}
</body>

</html>
